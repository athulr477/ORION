services:
  db:
    image: pgvector/pgvector:pg16
    container_name: orion-db
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion_secret
      POSTGRES_DB: orion_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
