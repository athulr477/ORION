<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <defs>
    <!-- Sharp academic black arrowhead -->
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title & Figure Header -->
  <g id="figure-header">
    <text x="575" y="38" text-anchor="middle" fill="#000000" font-size="18" font-weight="bold" letter-spacing="0.5">Figure 3.1: Context Level Data Flow Diagram (Level 0 DFD)</text>
    <text x="575" y="58" text-anchor="middle" fill="#333333" font-size="13" font-style="italic">Orion Continuous Automated Requirements Traceability &amp; Verification Gating Engine</text>
    <line x1="80" y1="72" x2="1070" y2="72" stroke="#000000" stroke-width="1.2" />
  </g>

  <!-- ==================== FLOW ARROWS ==================== -->

  <!-- Jira Cloud <-> Orion Engine -->
  <!-- Jira -> Engine -->
  <path d="M 270 145 C 380 145, 410 260, 480 320" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />
  <!-- Engine -> Jira -->
  <path d="M 465 350 C 400 290, 370 180, 270 175" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />

  <!-- GitHub CI/CD <-> Orion Engine -->
  <!-- GitHub -> Engine -->
  <path d="M 270 275 C 370 275, 410 330, 470 355" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />
  <!-- Engine -> GitHub -->
  <path d="M 465 385 C 410 360, 370 305, 270 305" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />

  <!-- Developer <-> Orion Engine -->
  <!-- Developer -> Engine -->
  <path d="M 270 425 C 370 425, 410 410, 470 410" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />
  <!-- Engine -> Developer -->
  <path d="M 470 440 C 410 440, 370 455, 270 455" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />

  <!-- QA Lead <-> Orion Engine -->
  <!-- QA Lead -> Engine -->
  <path d="M 270 560 C 370 560, 410 500, 470 465" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />
  <!-- Engine -> QA Lead -->
  <path d="M 480 495 C 410 540, 380 590, 270 590" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />

  <!-- Orion Engine <-> PostgreSQL Database -->
  <!-- Engine -> DB -->
  <path d="M 685 390 L 830 390" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />
  <!-- DB -> Engine -->
  <path d="M 830 435 L 685 435" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-black)" />


  <!-- ==================== FLOW LABELS ==================== -->
  
  <!-- Jira Inbound -->
  <text x="365" y="180" fill="#000000" font-size="11" font-style="italic">Requirement Issues (ADF)</text>
  <!-- Jira Outbound -->
  <text x="365" y="240" fill="#000000" font-size="11" font-style="italic">Trace Status Comments</text>

  <!-- GitHub Inbound -->
  <text x="355" y="295" fill="#000000" font-size="11" font-style="italic">PR Commits &amp; Test Code</text>
  <!-- GitHub Outbound -->
  <text x="360" y="348" fill="#000000" font-size="11" font-style="italic">Check Run Verdict Gating</text>

  <!-- Developer Inbound -->
  <text x="345" y="418" fill="#000000" font-size="11" font-style="italic">Test Assertions &amp; Code</text>
  <!-- Developer Outbound -->
  <text x="345" y="468" fill="#000000" font-size="11" font-style="italic">XAI Explanations &amp; Gaps</text>

  <!-- QA Lead Inbound -->
  <text x="355" y="525" fill="#000000" font-size="11" font-style="italic">Sensitivity Thresholds &amp; Overrides</text>
  <!-- QA Lead Outbound -->
  <text x="360" y="605" fill="#000000" font-size="11" font-style="italic">RTM Dashboard &amp; Audit Logs</text>

  <!-- DB Write -->
  <text x="758" y="380" text-anchor="middle" fill="#000000" font-size="11" font-style="italic">Store Vectors &amp; Links</text>
  <!-- DB Read -->
  <text x="758" y="455" text-anchor="middle" fill="#000000" font-size="11" font-style="italic">Query Embeddings &amp; State</text>


  <!-- ==================== EXTERNAL ENTITIES (LEFT) ==================== -->

  <!-- Entity 1: Jira Cloud -->
  <g id="entity-jira">
    <rect x="70" y="125" width="200" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="170" y="163" text-anchor="middle" fill="#000000" font-size="16" font-weight="bold">Jira Cloud</text>
  </g>

  <!-- Entity 2: GitHub CI/CD -->
  <g id="entity-github">
    <rect x="70" y="255" width="200" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="170" y="293" text-anchor="middle" fill="#000000" font-size="16" font-weight="bold">GitHub CI/CD</text>
  </g>

  <!-- Entity 3: Developer -->
  <g id="entity-developer">
    <rect x="70" y="405" width="200" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="170" y="443" text-anchor="middle" fill="#000000" font-size="16" font-weight="bold">Developer</text>
  </g>

  <!-- Entity 4: QA Lead / Auditor -->
  <g id="entity-qalead">
    <rect x="70" y="545" width="200" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="170" y="583" text-anchor="middle" fill="#000000" font-size="15" font-weight="bold">QA Lead / Auditor</text>
  </g>


  <!-- ==================== CENTRAL PROCESS 0.0 ==================== -->
  <g id="process-0">
    <ellipse cx="580" cy="410" rx="105" ry="110" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <text x="580" y="380" text-anchor="middle" fill="#000000" font-size="16" font-style="italic" font-weight="bold">0.0</text>
    <text x="580" y="412" text-anchor="middle" fill="#000000" font-size="19" font-style="italic" font-weight="bold">Orion Governance</text>
    <text x="580" y="438" text-anchor="middle" fill="#000000" font-size="19" font-style="italic" font-weight="bold">Engine</text>
  </g>


  <!-- ==================== DATABASE CYLINDER (RIGHT) ==================== -->
  <!-- Authentic academic 3D database storage cylinder with disk pack rings -->
  <g id="database-cylinder" transform="translate(830, 305)">
    <!-- Base Cylinder Body -->
    <path d="M 0 45 L 0 210 C 0 240, 190 240, 190 210 L 190 45 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    
    <!-- Cylinder Disk Rim 1 (Middle) -->
    <path d="M 0 70 C 0 100, 190 100, 190 70" fill="none" stroke="#000000" stroke-width="1.6" />
    
    <!-- Cylinder Disk Rim 2 (Lower rim) -->
    <path d="M 0 95 C 0 125, 190 125, 190 95" fill="none" stroke="#000000" stroke-width="1.6" />

    <!-- Top Cap Ellipse -->
    <ellipse cx="95" cy="45" rx="95" ry="32" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    
    <!-- Inner Rim Line on Top Cap -->
    <ellipse cx="95" cy="48" rx="88" ry="26" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3,2" />

    <!-- Database Labels -->
    <text x="95" y="150" text-anchor="middle" fill="#000000" font-size="16" font-weight="bold">PostgreSQL</text>
    <text x="95" y="172" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">Database</text>
    <text x="95" y="194" text-anchor="middle" fill="#333333" font-size="12" font-style="italic">(pgvector &amp; RTM)</text>
  </g>

  <!-- Bottom Academic Footnote -->
  <g id="footer">
    <line x1="80" y1="670" x2="1070" y2="670" stroke="#888888" stroke-width="0.8" />
    <text x="575" y="692" text-anchor="middle" fill="#555555" font-size="11.5">Department of Computer Applications • MCA Project Report • Calicut University Guidelines</text>
  </g>
</svg>
