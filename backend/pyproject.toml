[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion"
version = "0.1.0"
description = "Orion — AI-powered Requirements Traceability Matrix engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.3.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0; sys_platform != 'win32'",
    "onnxruntime>=1.17.0",
    "transformers>=4.40.0",
    "numpy>=1.26.0",
    "ollama>=0.4.0",
    "PyJWT[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.setuptools.packages.find]
include = ["orion*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["tests/polyglot/sample_tests"]


[tool.pyrefly]
project-includes = [
    "orion/**/*.py",
]
project-excludes = [
    "**/__pycache__/**",
    "**/.venv/**",
    "tests/**",
    "scripts/**",
    "scratch/**",
]
search-path = [
    ".",
]

